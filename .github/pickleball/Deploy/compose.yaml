name: court-club
services:
  api:
    image: court-club-api:local
    network_mode: host
    restart: unless-stopped
    env_file: /etc/court-club/api.env
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/lib/court-club:/data
      - /etc/court-club/members.json:/config/members.json:ro
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  gateway:
    image: caddy:2-alpine
    network_mode: host
    restart: unless-stopped
    env_file: /etc/court-club/gateway.env
    volumes:
      - /etc/court-club/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
volumes:
  caddy_data:
  caddy_config:
