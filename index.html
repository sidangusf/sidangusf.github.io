<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>995 Studio</title>
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f8f8;
            color: #222;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 100%;
            padding: 40px 20px;
            max-width: 800px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.75rem, 11vw, 4rem);
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.05;
        }

        .subtitle {
            margin-top: 24px;
            font-size: clamp(1.2rem, 4.5vw, 1.6rem);
            color: #666;
            line-height: 1.4;
        }

        .contact {
            margin-top: 20px;
            font-size: clamp(1.05rem, 4vw, 1.4rem);
            color: #555;
        }

        .contact a {
            color: #222;
            text-decoration: none;
            font-weight: 600;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        .project-links {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .project-category {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .project-category + .project-category {
            margin-left: 12px;
            padding-left: 24px;
            border-left: 1px solid #ddd;
        }

        .project-category-title {
            margin: 0;
            color: #555;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .project-category-items {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
        }

        .project-link {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            width: 160px;
            min-width: 0;
            color: #222;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .project-link:hover,
        .project-link:focus-visible {
            transform: translateY(-2px);
        }

        .project-link:focus-visible {
            outline: 3px solid rgba(34, 34, 34, 0.35);
            outline-offset: 8px;
            border-radius: 32px;
        }

        .project-link-image {
            display: block;
            width: 132px;
            height: 132px;
            border-radius: 30px;
            background-color: #fff;
            object-fit: contain;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
            transition: box-shadow 0.2s ease;
        }

        .project-link:hover .project-link-image,
        .project-link:focus-visible .project-link-image {
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.16);
        }

        .project-name {
            margin-top: 10px;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .project-note {
            margin-top: 4px;
            color: #777;
            font-size: 0.82rem;
            line-height: 1.25;
        }

        .project-name,
        .project-note {
            overflow-wrap: anywhere;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }

            .subtitle {
                font-size: 1.25rem;
            }

            .contact {
                font-size: 1.15rem;
            }
        }

        @media (max-width: 480px) {
            body {
                align-items: flex-start;
            }

            .container {
                padding: 44px 0 32px;
            }

            h1 {
                font-size: clamp(2.35rem, 14vw, 3rem);
            }

            .subtitle {
                margin-top: 18px;
            }

            .project-links {
                display: grid;
                grid-template-columns: 1fr;
                gap: 26px;
            }

            .project-category + .project-category {
                margin-left: 0;
                padding-top: 26px;
                padding-left: 0;
                border-top: 1px solid #ddd;
                border-left: 0;
            }

            .project-category-items {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                align-items: start;
                gap: 22px 12px;
            }

            .project-link {
                width: 100%;
                max-width: none;
            }

            .project-link-image {
                width: min(34vw, 132px);
                height: min(34vw, 132px);
                border-radius: 26px;
            }

            .project-name {
                font-size: 0.95rem;
            }

            .project-note {
                font-size: 0.76rem;
            }

            .contact a {
                display: block;
                margin-top: 4px;
                overflow-wrap: anywhere;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>995 Studio</h1>

        <div class="subtitle">
            Building simple, thoughtful, and useful digital experiences.
        </div>

        <div class="project-links" aria-label="995 Studio projects">
            <section class="project-category" aria-labelledby="mobile-app-title">
                <h2 class="project-category-title" id="mobile-app-title">Mobile App</h2>
                <div class="project-category-items">
                    <a class="project-link" href="manifest/" aria-label="Open Manifest">
                        <img class="project-link-image" src="manifest/assets/logoApp.png" alt="Manifest app logo">
                        <span class="project-name">Manifest</span>
                    </a>
                    <a class="project-link" href="nothing-worse/" aria-label="Open Nothing Worse">
                        <img class="project-link-image" src="nothing-worse/assets/nothing-worse-logo-golden-background.png" alt="Nothing Worse app logo">
                        <span class="project-name">Nothing Worse</span>
                    </a>
                </div>
            </section>
            <section class="project-category" aria-labelledby="mobile-game-title">
                <h2 class="project-category-title" id="mobile-game-title">Mobile Game</h2>
                <div class="project-category-items">
                    <a class="project-link" href="https://apps.apple.com/us/app/woofy-doggy-endless-run/id6450281076" aria-label="Open Woofy Doogy - Endless Run on the App Store">
                        <img class="project-link-image" src="Logo-Woofy.png" alt="Woofy Doogy - Endless Run app logo">
                        <span class="project-name">Woofy Doogy - Endless Run!</span>
                        <span class="project-note">iOS only · Android not available</span>
                    </a>
                    <a class="project-link" href="https://apps.apple.com/us/app/ole-arcade/id1667406683" aria-label="Open Tap On Red on the App Store">
                        <img class="project-link-image" src="Glogo-Ole.jpg" alt="Tap On Red app logo">
                        <span class="project-name">Tap On Red</span>
                        <span class="project-note">iOS only · Android not available</span>
                    </a>
                </div>
            </section>
        </div>

        <div class="contact">
            Contact:
            <a href="mailto:support@995studio.com">
                support@995studio.com
            </a>
        </div>
    </div>
    <!-- GitHub Pages deployment refresh. -->
</body>
</html>
