name: Pickleball checks
on:
  pull_request:
    paths: ['pickleball/**', '.github/pickleball/**', '.github/workflows/pickleball-checks.yml']
  push:
    branches: ['feat/pickleball-booking']
    paths: ['pickleball/**', '.github/pickleball/**', '.github/workflows/pickleball-checks.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build .github/pickleball/Server/CourtClub.csproj --configuration Release
      - run: dotnet run --project .github/pickleball/Tests/Tests.csproj --configuration Release
